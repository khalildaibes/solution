# Default values for http-echo.

replicaCount: 1

image:
  repository: ealen/echo-server
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""
  # The echo server never calls the Kubernetes API, so do not mount a token into the pod.
  automountServiceAccountToken: false

podAnnotations: {}

app:
  # Port the echo-server process listens on. The image reads it from the PORT env var
  # (default 80). An unprivileged port lets the container run as a non-root user.
  port: 5678

# Pod-level hardening: unprivileged UID, default seccomp profile.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Container-level hardening: the app only needs to read its own code and open a socket.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 5678

ingress:
  enabled: true
  className: "nginx"
  annotations:
    # The assignment verifies both http:// and https://, so plain HTTP is not redirected.
    # In a real production deployment set this to "true" so every client is forced onto TLS.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: http-echo.k8s-server.local
      paths:
        - path: /
          pathType: Prefix
  # TLS is terminated by ingress-nginx. The secret is created out of band
  # (scripts/03-create-tls-secret.sh for the lab, cert-manager in production).
  tls:
    - secretName: http-echo-tls
      hosts:
        - http-echo.k8s-server.local

# Measured footprint of echo-server 0.5.2 at idle: ~18 MiB RSS, ~0 CPU (docker stats).
# Requests reflect what the pod really needs so it schedules on any node (e.g. a 2-CPU
# minikube VM). No CPU limit on purpose: CFS throttling adds latency and brings no benefit here.
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

# HTTP probes against the app port. The image has no bash, so exec probes are not an option.
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
