# kind cluster used for the ThetaRay http-echo assignment.
# - one control-plane node (minimal overhead for a local lab)
# - node labelled ingress-ready=true so the ingress-nginx "kind" manifest schedules on it
# - host ports 80/443 mapped into the node so the ingress controller is reachable at 127.0.0.1
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: thetaray
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
